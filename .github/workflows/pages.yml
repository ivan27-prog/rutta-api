name: Deploy static to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio con rutas del subdirectorio
        run: |
          mkdir _site
          cp -r src/main/resources/static/. _site/
          # Antepone /rutta-api a las rutas absolutas internas
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) \
            -exec sed -i -E "s#([\"'\`(=])/(assets|pages|services|video)/#\1/rutta-api/\2/#g" {} +
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
